name: CI - Web App

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "agents/**"
      - "docs/**"
      - ".kiro/**"
      - "*.md"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "agents/**"
      - "docs/**"
      - ".kiro/**"
      - "*.md"

jobs:
  quality:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Amplify の深い依存ツリー（@aws-amplify/backend-cli 系）が浮動バージョンを含み、
      # npm install が書く lockfile を npm ci が厳密検証で弾くことがあるため install を使う。
      # lockfile はコミット済みで、install はそれを起点に解決する。
      - name: 依存関係のインストール
        run: npm install

      - name: Lint
        run: npm run lint

      - name: 型チェック
        run: npx tsc --noEmit

      - name: テスト
        run: npm run test
